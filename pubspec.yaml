name: ec8a_scanner
description: "EC8A Scanner - NDC agents scan INEC Form EC 8A polling unit results."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # state management
  flutter_riverpod: ^2.6.1

  # backend (auth, db, storage, realtime)
  supabase_flutter: ^2.8.0

  # scanning
  google_mlkit_text_recognition: ^0.17.1
  mobile_scanner: ^7.0.0
  camera: ^0.11.0+2

  # offline queue (file-backed, atomic rename; server idempotency via client_uid)
  path_provider: ^2.1.4

  # utilities
  csv: ^6.0.0
  file_picker: ^12.2.0
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true